name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Unit tests (API, root Vitest, worker)
        run: pnpm test:unit
      - name: Core infrastructure contract
        run: pnpm test:core-infra
      - name: Core API Autoscale contract
        run: pnpm test:core-api-autoscale
      - name: Core worker Reserved VM contract
        run: pnpm test:core-worker-vm

  integration-e2e-local:
    needs: [build]
    runs-on: ubuntu-latest
    env:
      CI_TEST_API_KEY: sinna-ci-test-api-key
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      REDIS_URL: redis://127.0.0.1:6379
      PORT: 4000
      NODE_ENV: test
      JWT_SECRET: ci-jwt-secret-not-for-production
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Step 9 disposable PostgreSQL adversarial tests
        env:
          TEST_MIGRATION_DATABASE_URL: ${{ env.DATABASE_URL }}
          CONFIRM_DISPOSABLE_MIGRATION_DATABASE: YES
          DATABASE_SSL_MODE: disable
        run: pnpm test:migrate:integration
      - name: Bootstrap, apply, and verify fresh DB migrations
        run: |
          set -euo pipefail
          # This disposable database starts empty. Bootstrap is intentionally
          # followed by apply and verification; application startup never migrates.
          pnpm migrate:bootstrap
          pnpm migrate:apply
          pnpm migrate:verify
      - name: Seed CI tenant and API key
        run: |
          set -euo pipefail
          H=$(printf '%s' "$CI_TEST_API_KEY" | sha256sum | awk '{print $1}')
          TENANT_ID=$(psql "$DATABASE_URL" -Atq -c \
            "insert into tenants(name, active, plan, status) values ('ci', true, 'standard', 'active') returning id;" \
            | tr -d '[:space:]')
          psql "$DATABASE_URL" -c \
            "insert into api_keys(key_hash, tenant_id) values ('$H', '$TENANT_ID');"
      - name: Start API
        run: |
          nohup node apps/api/dist/index.js > api.log 2>&1 &
          echo $! > api.pid
          sleep 2
          if ! ps -p "$(cat api.pid)" > /dev/null 2>&1; then
            echo "API exited during startup"
            cat api.log
            exit 1
          fi
      - name: Wait for API
        run: bash scripts/wait-for-api.sh "http://127.0.0.1:${PORT}" 90
      - name: Start minimal queue workers (BullMQ)
        run: |
          nohup node -e "
            const { Worker } = require('bullmq');
            const IORedis = require('ioredis');
            const c = new IORedis(process.env.REDIS_URL);
            const mk = (q) => new Worker(q, async () => ({ ok: true }), { connection: c });
            mk('captions'); mk('ad'); mk('color'); mk('video-transform');
            setInterval(() => {}, 1 << 30);
          " > worker.log 2>&1 &
          echo $! > worker.pid
      - name: Vitest integration smoke (live HTTP)
        env:
          E2E_BASE_URL: http://127.0.0.1:4000
          API_BASE_URL: http://127.0.0.1:4000
          TEST_API_KEY: ${{ env.CI_TEST_API_KEY }}
          API_KEY: ${{ env.CI_TEST_API_KEY }}
        run: pnpm test:integration
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright E2E (health)
        env:
          E2E_BASE_URL: http://127.0.0.1:4000
          API_KEY: ${{ env.CI_TEST_API_KEY }}
        run: pnpm test:e2e
      - name: API package unit tests (with DB)
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pnpm -C apps/api test
      - name: Stop API and workers
        if: always()
        run: |
          for f in api.pid worker.pid; do
            if [ -f "$f" ]; then
              PID=$(cat "$f")
              if kill -0 "$PID" 2>/dev/null; then kill -9 "$PID" || true; fi
            fi
          done
          if [ -f api.log ]; then echo "--- api.log ---"; tail -n 80 api.log; fi

  integration-e2e-staging:
    needs: [build, integration-e2e-local]
    # A staging-only opt-in: main pushes or a manual dispatch, never pull requests.
    if: >-
      vars.ENABLE_STAGING_E2E == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: staging
    env:
      STAGING_E2E_BASE_URL: ${{ secrets.STAGING_E2E_BASE_URL }}
      STAGING_E2E_API_KEY: ${{ secrets.STAGING_E2E_API_KEY }}
      STAGING_ALLOWED_HOST: ${{ vars.STAGING_ALLOWED_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate staging target (fail closed)
        run: node scripts/assert-staging-target.mjs
      - name: Staging integration smoke
        run: pnpm smoke:staging
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright E2E (staging only)
        run: pnpm test:e2e --reporter=html
      - name: Upload staging E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staging-e2e-diagnostics-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            playwright-report/
            test-results/
            *.log

  ci-eligibility-note:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, integration-e2e-local]
    runs-on: ubuntu-latest
    steps:
      - name: Record CI eligibility only
        run: |
          echo "Successful main CI does not deploy."
          echo "This revision is eligible for staging and manual production promotion."
