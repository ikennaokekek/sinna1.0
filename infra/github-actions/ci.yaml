name: CI (infra manual validation)

on:
  workflow_dispatch:

# The canonical primary CI workflow is .github/workflows/ci.yaml.
permissions:
  contents: read

concurrency:
  group: infra-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Unit tests
        run: pnpm test:unit